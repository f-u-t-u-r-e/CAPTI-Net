[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capti-net"
version = "1.0.0"
description = "Chemical Abundance and Pharmacophore Topology Interaction Network"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
include = ["capti*"]
